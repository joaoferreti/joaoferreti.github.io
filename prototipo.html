  if (k === "JUNGLE+UTILITY") return 20;
  if (k === "MIDDLE+UTILITY") return 15;
  return 10;
}
function score(myRole, p) {
  let pts = rolePoints(myRole, p.role);
  pts += Math.max(0, 20 - Math.abs(rankValue(ME.tier, ME.div) - rankValue(p.tier, p.div)) * 2.5);
  pts += 10 + Math.min(10, endorseCount(p));
  pts += ME.style === p.style ? 10 : (["tryhard","for_fun"].includes(ME.style) && ["tryhard","for_fun"].includes(p.style) ? 0 : 5);
  pts += ME.mic && p.mic ? 5 : (!ME.mic && !p.mic ? 3 : 0);
  const base = Math.min(ME.hours.length, p.hours.length);
  if (base) pts += 10 * ME.hours.filter(h => p.hours.includes(h)).length / base;
  if (SYNERGY.some(([x,y]) => (ME.mains.includes(x) && p.mains.includes(y)) || (ME.mains.includes(y) && p.mains.includes(x)))) pts += 5;
  return Math.min(100, Math.round(pts));
}

const SCREENS = { feed: renderFeed, player: renderPlayer, duos: renderDuos, duo: renderDuo, profile: renderProfile, background: renderBackground, login: renderLogin, onboarding: renderOnboarding, riot: renderLinkRiot };
const TAB_SCREENS = ["feed", "duos", "profile", "player", "duo", "background"];

function render(keepScroll = true) {
  const v = $("#view");
  const y = v.scrollTop;
  v.innerHTML = SCREENS[S.screen]();
  if (keepScroll) v.scrollTop = y;
  const inTabs = TAB_SCREENS.includes(S.screen);
  const tabs = $("#tabs");
  tabs.style.display = inTabs ? "" : "none";
  tabs.innerHTML = inTabs ? [["feed", "flash", "Agora"], ["duos", "people", "Duos"], ["profile", "personc", "Perfil"]].map(([k, i, l]) =>
    `<button data-act="tab:${k}" ${S.tab === k ? 'aria-current="page"' : ""}>${ic(i, 23)}${l}${k === "duos" && S.incoming.length ? `<span class="badge">${S.incoming.length}</span>` : ""}</button>`).join("") : "";
  document.querySelectorAll(".toast,.modal").forEach(n => n.remove());
  if (S.toast) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = S.toast; $("#app").appendChild(t); }
  if (S.modal) { const m = document.createElement("div"); m.className = "modal"; m.innerHTML = S.modal; $("#app").appendChild(m); }
}
function go(screen, tab) {
  if (screen === "player") S.prev = S.screen;
  S.screen = screen; if (tab) S.tab = tab;
  S.reporting = false; S.shownRole = null; S.mastAll = false;
  render(false);
}
function toast(msg) { S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 2600); }

function makeDuo(p, queue) {
  const d = { id: "d" + Date.now(), p, queue, at: Date.now(), confirmed: false, rated: false, skipped: false, tags: [] };
  S.duos.unshift(d);
  S.duoId = d.id;
  go("duo", "duos");
}
function scheduleIncoming() {
  clearTimeout(scheduleIncoming.t);
  scheduleIncoming.t = setTimeout(() => {
    const p = byId("p5");
    if (!S.presence || S.incoming.length || S.duos.some(d => d.p.id === p.id)) return;
    S.incoming.push({ p, queue: S.presence.queue, expires: Date.now() + 120000 });
    toast(`${p.name} te chamou pra duo!`);
  }, 8000);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  if (el.closest(".tap") && el !== el.closest(".tap") && !el.closest("button")) return;
  e.stopPropagation();
  const [act, arg] = el.dataset.act.split(/:(.*)/s);
  const f = S.filters;
  switch (act) {
    case "tab": go(arg, arg); return;
    case "go": go(arg); return;
    case "open": S.playerId = arg; go("player"); return;
    case "back": go(S.prev === "player" ? "feed" : S.prev); return;
    case "queue": S.queue = arg; break;
    case "role1": S.role1 = arg; if (S.role2 === arg || arg === "FILL") S.role2 = null; break;
    case "role2": S.role2 = S.role2 === arg ? null : arg; break;
    case "online": S.presence = { queue: S.queue, role1: S.role1, role2: S.role2, since: Date.now() }; scheduleIncoming(); toast("Você está no feed. Quem entrar vai te ver."); return;
    case "offline": S.presence = null; break;
    case "frole": f.role = f.role === arg ? null : arg; break;
    case "fstyle": f.style = f.style === arg ? null : arg; break;
    case "fmic": f.mic = !f.mic; break;
    case "felog": f.elog = !f.elog; break;
    case "fclear": S.filters = { role: null, mic: false, style: null, elog: false }; break;
    case "invite": {
      if (!S.presence) { S.modal = `<div class="card"><h2>Ative a busca primeiro</h2><div class="muted">Toque em "Buscar duo agora" para poder chamar alguém.</div>${btn("OK", "closemodal")}</div>`; break; }
      const p = byId(arg);
      if (S.sent.some(i => i.p.id === p.id)) { toast("Você já chamou esse jogador."); return; }
      S.sent.push({ p, expires: Date.now() + 120000 });
      toast(`Convite enviado. ${p.name} tem 2 minutos para aceitar.`);
      setTimeout(() => {
        if (!S.sent.some(i => i.p.id === p.id)) return;
        S.sent = S.sent.filter(i => i.p.id !== p.id);
        S.presence && (S.presence = null);
        makeDuo(p, S.queue);
        toast(`${p.name} aceitou! Riot ID liberado.`);
      }, 5000);
      return;
    }
    case "cancel": S.sent = S.sent.filter(i => i.p.id !== arg); break;
    case "accept": { const i = S.incoming.find(x => x.p.id === arg); S.incoming = S.incoming.filter(x => x !== i); S.presence = null; makeDuo(i.p, i.queue); return; }
    case "decline": S.incoming = S.incoming.filter(x => x.p.id !== arg); break;
    case "duo": S.duoId = arg; go("duo"); return;
    case "confirm": S.duos.find(d => d.id === arg).confirmed = true; break;
    case "etag": { const d = S.duos.find(x => x.id === S.duoId); d.tags = d.tags.includes(arg) ? d.tags.filter(t => t !== arg) : [...d.tags, arg]; break; }
    case "endorse": { const d = S.duos.find(x => x.id === S.duoId); d.tags.forEach(t => d.p.endorse[t] = (d.p.endorse[t] || 0) + 1); d.rated = true; break; }
    case "skip": S.duos.find(x => x.id === S.duoId).skipped = true; break;
    case "copy": navigator.clipboard?.writeText(arg).then(() => toast("Riot ID copiado"), () => toast("Selecione o Riot ID para copiar")); return;
    case "block": { const p = byId(arg); S.modal = `<div class="card"><h2>Bloquear ${esc(p.name)}?</h2><div class="muted">Vocês deixam de se ver no app. Não dá para desfazer pelo app.</div><div class="row">${btn("Cancelar", "closemodal", "sec grow")}${btn("Bloquear", "doblock:" + arg, "danger grow")}</div></div>`; break; }
    case "doblock": PLAYERS.splice(PLAYERS.findIndex(x => x.id === arg), 1); S.modal = null; go("feed", "feed"); toast("Jogador bloqueado. Vocês não se veem mais."); return;
    case "reporting": S.reporting = !S.reporting; break;
    case "report": S.reporting = false; S.modal = `<div class="card"><h2>Denúncia enviada</h2><div class="muted">Obrigado. Nossa moderação vai analisar.</div>${btn("OK", "closemodal")}</div>`; break;
    case "closemodal": S.modal = null; break;
    case "showrole": S.shownRole = S.shownRole === arg ? null : arg; break;
    case "mastall": S.mastAll = !S.mastAll; break;
    case "sync": toast("Elo atualizado"); return;
    case "mystyle": ME.style = arg; break;
    case "slot": { const h = SLOTS[+arg][1]; ME.hours = h.every(x => ME.hours.includes(x)) ? ME.hours.filter(x => !h.includes(x)) : [...new Set([...ME.hours, ...h])].sort((a, b) => a - b); break; }
    case "mymic": ME.mic = !ME.mic; break;
    case "mymicreq": ME.micReq = !ME.micReq; break;
    case "save": ME.bio = $("#bio").value.trim(); ME.discord = $("#discord").value.trim() || null; S.modal = `<div class="card"><h2>Salvo</h2>${btn("OK", "closemodal")}</div>`; break;
    case "setbg": ME.bg = arg === "auto" ? null : +arg; S.bgQuery = ""; go("profile"); return;
    case "logout": S.login = { mode: "entrar", email: "", pw: "" }; S.onb = { age: false, terms: false }; S.riotStep = "id"; S.riotId = ""; go("login"); return;
    case "askdelete": S.modal = `<div class="card"><h2>Excluir sua conta?</h2><div class="muted">Apagamos seu perfil, o vínculo com a conta Riot, sua maestria, seus duos e elogios. Não dá para desfazer.</div><div class="row">${btn("Cancelar", "closemodal", "sec grow")}${btn("Excluir", "dodelete", "danger grow")}</div></div>`; break;
    case "dodelete": S.modal = null; S.login = { mode: "criar", email: "", pw: "" }; go("login"); toast("Conta excluída (no protótipo nada é apagado)."); return;
    case "lmode": S.login.mode = arg; break;
    case "login": go("onboarding"); return;
    case "onb": S.onb[arg] = !S.onb[arg]; break;
    case "riot":
      if (arg === "done") { ME.name = S.riotId.split("#")[0] || ME.name; ME.tag = S.riotId.split("#")[1] || ME.tag; go("feed", "feed"); toast(`Conta verificada: ${fmtRank(ME.tier, ME.div, ME.lp)}`); return; }
      S.riotStep = arg; break;
    case "toast": toast(arg); return;
    default: return;
  }
  render();
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".tap[role=button]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "email" || t.id === "pw") {
    S.login[t.id] = t.value;
    $("#loginbtn").disabled = !(S.login.email.includes("@") && S.login.pw.length >= 6);
  } else if (t.id === "rid") {
    S.riotId = t.value.trim();
    $("#riotbtn").disabled = !S.riotId.includes("#");
  } else if (t.id === "bgsearch") {
    S.bgQuery = t.value;
    $("#bggrid").innerHTML = bgTiles();
  }
});

setInterval(() => {
  const now = Date.now();
  const before = S.incoming.length + S.sent.length;
  S.incoming = S.incoming.filter(i => i.expires > now);
  S.sent = S.sent.filter(i => i.expires > now);
  const typing = document.activeElement && document.activeElement.matches("input,textarea");
  if (!typing && (S.screen === "duos" || before !== S.incoming.length + S.sent.length)) render();
}, 1000);

function probe(url) {
  return new Promise(res => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = url; setTimeout(() => res(false), 6000); });
}
(async () => {
  const [dd, emb, roleImg] = await Promise.all([probe(champIcon(222)), probe(emblemUrl("GOLD")), probe(roleUrl("TOP"))]);
  let roleMode = "text";
  if (roleImg) {
    roleMode = "img";
    try { const r = await fetch(roleUrl("TOP"), { mode: "cors" }); if (r.ok) roleMode = "mask"; } catch {}
  }
  const changed = dd !== IMG.dd || emb !== IMG.emblem || roleMode !== IMG.role;
  Object.assign(IMG, { dd, emblem: emb, role: roleMode });
  if (changed && !(document.activeElement && document.activeElement.matches("input,textarea"))) render();
})();

render();
</script>
